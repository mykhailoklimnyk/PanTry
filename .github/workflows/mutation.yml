name: Мутації (ядро)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Мутації по core/
        run: uv run mutmut run

      - name: Звіт
        if: always()
        run: uv run mutmut results

      - name: Знімок для сторінки «Якість»
        if: always()
        run: |
          uv run python scripts/mutation_snapshot.py
          cat docs/mutation.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-snapshot
          path: docs/mutation.json
