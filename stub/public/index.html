<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>ПанTry — на паузі</title>
<link rel="icon" type="image/png" href="/logo-mark.png">
<style>
:root{--bg:#f7f7f5;--fg:#1b1b1a;--mut:#6b6b66;--card:#fff;--brd:#e4e4df;--acc:#2f6fed}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececea;--mut:#9a9a94;--card:#1c1c1c;--brd:#2c2c2a;--acc:#6f9bff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{width:100%;max-width:420px}
.mark{width:56px;height:56px;border-radius:14px;display:block;margin-bottom:20px}
h1{font-size:24px;margin:0 0 6px}
p{color:var(--mut);margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--brd);border-radius:12px;background:var(--card);color:var(--fg);text-decoration:none}
a:hover,a:focus-visible{border-color:var(--acc)}
a span{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<img class="mark" src="/logo-mark.png" alt="" width="56" height="56">
<h1>ПанTry на паузі</h1>
<p>Проєкт зупинено. Ось де я зараз — Mykhailo Klimnyk.</p>
<ul>
<li><a href="https://klimnyk.dev/">klimnyk.dev<span>про мене</span></a></li>
<li><a href="https://trofey.app/">Trofey<span>trofey.app</span></a></li>
<li><a href="https://github.com/mykhailoklimnyk">GitHub<span>@mykhailoklimnyk</span></a></li>
<li><a href="https://github.com/AyeOps">AyeOps<span>github.com/AyeOps</span></a></li>
</ul>
</main>
</body>
</html>
