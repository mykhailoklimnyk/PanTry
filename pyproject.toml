[project]
name = "komora"
version = "0.1.0"
description = "ПанTry — стан дому з чеків і кошик з мандатом на заміну. Хакатон «Сільпо» AI Factory."
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "fastapi>=0.141.1",
    "granian>=2.8.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "mcp>=2.0.0",
    "anthropic[bedrock]>=0.121.0",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "jsonschema>=4.26.0",
    "cryptography>=46.0.0",
]

[project.scripts]
komora-migrate = "komora.db.migrate:main"
komora-warm = "komora.jobs.warm:main"
komora-notify = "komora.notify:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.165.4",
    "mutmut>=3.7.0",
    "ruff>=0.16.2",
    "pytest-socket>=0.8.0",
    "ty>=0.0.71",
    "pyyaml>=6.0.3",
    "winloop>=0.6.3; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "komora"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
markers = ["long_summary: тест навмисно робить фразу кроку довшою за стелю"]

[tool.mutmut]
source_paths = ["src/komora"]

only_mutate = [
    "src/komora/core/*",
    "src/komora/mcp/redact.py",
    "src/komora/mcp/inventory.py",
    "src/komora/agent/economics.py",
    "src/komora/auth/crypto.py",
    "src/komora/auth/flow.py",
    "src/komora/auth/pkce.py",
    "src/komora/auth/session.py",
    "src/komora/auth/llm_key.py",
    "src/komora/api/places.py",
    "src/komora/api/quota.py",
    "src/komora/api/runs.py",
]

pytest_add_cli_args_test_selection = [
    "tests/core",
    "tests/mcp",
    "tests/agent",
    "tests/auth",
    "tests/test_runs.py",
    "tests/test_checkout.py",
    "tests/test_correction.py",
    "tests/test_places.py",
    "tests/test_run_ceiling.py",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/core/test_spending.py" = ["B011", "DTZ001"]
"tests/test_agent_spending.py" = ["B011", "DTZ001"]
