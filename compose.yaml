services:
  db:
    image: postgres:18.4-alpine
    container_name: komora-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не заданий у .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не заданий у .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не заданий у .env}
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - komora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  komora-pgdata:
